<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>快捷指令大全</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app" id="app">

    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <span class="header-title">快捷指令大全</span>
        <a class="header-github" href="https://github.com/jiyuan468-hash/ios-shortcuts-collection" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.866-.013-1.7-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
        </a>
      </div>
    </header>

    <!-- Home View -->
    <main id="home-view">
      <section class="hero">
        <div class="hero-icon">⚡</div>
        <h1>快捷指令大全</h1>
        <p>让 iPhone 更聪明的自动化生活</p>
      </section>

      <div class="search-bar">
        <div class="search-icon">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.58 4.24-1.53l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>
        <input type="text" id="search-input" placeholder="搜索快捷指令…" autocomplete="off" />
      </div>

      <div id="no-results" class="no-results">
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <div class="empty-title">没有找到相关指令</div>
          <div class="empty-desc">试试其他关键词</div>
        </div>
      </div>

      <div id="categories-container" class="section"></div>

      <footer class="footer">
        <div class="footer-links">
          <a href="https://github.com/jiyuan468-hash/ios-shortcuts-collection" target="_blank" rel="noopener">GitHub</a>
          <a href="#" id="open-setup">使用指南</a>
        </div>
        <p>基于 iOS 快捷指令 · 免费开源</p>
      </footer>
    </main>

    <!-- Category Detail Page -->
    <div class="page" id="category-page">
      <div class="page-header">
        <button class="back-btn" id="cat-back">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <span class="page-title" id="cat-page-title"></span>
      </div>
      <div class="page-content" id="cat-page-content"></div>
    </div>

    <!-- Shortcut Detail Page -->
    <div class="page" id="shortcut-page">
      <div class="page-header">
        <button class="back-btn" id="sc-back">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <span class="page-title" id="sc-page-title"></span>
      </div>
      <div class="page-content" id="sc-page-content"></div>
    </div>

    <!-- Setup Page -->
    <div class="page" id="setup-page">
      <div class="page-header">
        <button class="back-btn" id="setup-back">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <span class="page-title">使用指南</span>
      </div>
      <div class="page-content" id="setup-content"></div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-item active" data-view="home">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>首页</span>
      </button>
      <button class="nav-item" data-view="search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.58 4.24-1.53l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span>搜索</span>
      </button>
      <button class="nav-item" id="nav-github">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.866-.013-1.7-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
        <span>GitHub</span>
      </button>
    </nav>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
